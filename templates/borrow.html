<!DOCTYPE html>
<html>
<head>
    <title>Borrow Book</title>
</head>
<body>
    <h1>Borrow Book</h1>
    <form method="POST">
        <label>ISBN:<input name="isbn" required></label><br>
        <label>Copy Number:<input name="copyNumber" type="number" min="1" required></label><br>
        <button type="submit">Borrow</button>
    </form>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
